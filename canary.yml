apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-v2
spec:
  replicas: 1   
  selector:
    matchLabels:
      app: node-app
      version: v2
  template:
    metadata:
      labels:
        app: node-app
        version: v2
    spec:
      containers:
      - name: node-app
        image: yekqpapp4q/app:v2
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-v2
spec:
  type: LoadBalancer
  selector:
    app: node-app
    version: v2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000

